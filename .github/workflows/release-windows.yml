name: release (windows)

# Called by release.yml (and release-dry-run.yml): the Inno Setup installer
# (app/packaging/windows/buwiz.iss) and an .msi (app/packaging/windows/
# buwiz.wxs, WiX v5) for per-machine and managed deployment, both
# Authenticode-signed with buwiz.exe inside them, for publish to upload to
# R2 as releases/v{VERSION}/Buwiz-{VERSION}-windows-x64-setup.exe and
# releases/v{VERSION}/Buwiz-{VERSION}-windows-x64.msi.
#
# Signing, as in the source repo: with neither WINDOWS_CERTIFICATE_PFX nor
# WINDOWS_CERTIFICATE_PASSWORD set both installers ship unsigned, with a
# warning on the run; exactly one of the two set fails.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # QuickJS (nsh-js) is C: bindgen needs libclang, which the image's LLVM has.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Windows signing mode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasPfx -and -not $hasPassword) {
            throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PASSWORD"
          }
          if ($hasPassword -and -not $hasPfx) {
            throw "Missing required Windows release secret: WINDOWS_CERTIFICATE_PFX"
          }
          if (-not ($hasPfx -and $hasPassword)) {
            "WINDOWS_SIGNING=0" >> $env:GITHUB_ENV
            Write-Output "::warning title=Unsigned Windows release::WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD are not set; the installer and MSI in this release are NOT Authenticode-signed and SmartScreen will warn on install."
          } else {
            "WINDOWS_SIGNING=1" >> $env:GITHUB_ENV
            $certificate = Join-Path $env:RUNNER_TEMP "windows-release-signing.pfx"
            try {
              [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            } catch {
              throw "WINDOWS_CERTIFICATE_PFX is not valid base64: $($_.Exception.Message)"
            }
            $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if (-not $sdk) { throw "Windows SDK signing tools were not found" }
            $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
            if (-not (Test-Path $signtool)) { throw "signtool.exe was not found" }
            "WINDOWS_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
            "WINDOWS_SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build
        working-directory: app
        run: cargo build --locked --release

      - name: Sign and verify buwiz.exe
        if: env.WINDOWS_SIGNING == '1'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $exe = "app/target/release/buwiz.exe"
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw "Signing failed: $exe" }
          & $env:WINDOWS_SIGNTOOL verify /pa /all /v $exe
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $exe" }

      # Setup runs it when the WebView2 Runtime (Evergreen) is missing.
      - name: Fetch the WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile app/target/MicrosoftEdgeWebview2Setup.exe

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/FBuwiz-$env:VERSION-windows-x64-setup" app/packaging/windows/buwiz.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "app/target/installer/Buwiz-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Inno Setup did not write $setup" }

      - name: Sign and verify the installer
        if: env.WINDOWS_SIGNING == '1'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $setup = "app/target/installer/Buwiz-$env:VERSION-windows-x64-setup.exe"
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "Signing failed: $setup" }
          & $env:WINDOWS_SIGNTOOL verify /pa /all /v $setup
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $setup" }

      - name: Build the MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX failed" }
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          $msi = "app/target/installer/Buwiz-$env:VERSION-windows-x64.msi"
          & $wix build -arch x64 -d "Version=$env:VERSION" `
            -d "ExePath=app/target/release/buwiz.exe" `
            -d "WebView2Setup=app/target/MicrosoftEdgeWebview2Setup.exe" `
            -o $msi app/packaging/windows/buwiz.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $msi)) { throw "WiX did not write $msi" }

      - name: Sign and verify the MSI
        if: env.WINDOWS_SIGNING == '1'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msi = "app/target/installer/Buwiz-$env:VERSION-windows-x64.msi"
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $msi
          if ($LASTEXITCODE -ne 0) { throw "Signing failed: $msi" }
          & $env:WINDOWS_SIGNTOOL verify /pa /all /v $msi
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $msi" }

      # The runner is thrown away afterwards: install the MSI for real,
      # check the files, shortcut and uninstall entry, then uninstall.
      - name: Install and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Resolve-Path "app/target/installer/Buwiz-$env:VERSION-windows-x64.msi").Path
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec /i exited $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles "Buwiz\buwiz.exe"
          $lnk = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\Buwiz.lnk"
          if (-not (Test-Path $exe)) { throw "The MSI did not install $exe" }
          if (-not (Test-Path $lnk)) { throw "The MSI did not create $lnk" }
          $entry = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Buwiz" -and $_.DisplayVersion -eq $env:VERSION }
          if (-not $entry) { throw "The MSI registered no Buwiz $env:VERSION uninstall entry" }
          $p = Start-Process msiexec.exe -ArgumentList "/x", "`"$msi`"", "/qn", "/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw "Uninstalling left $exe" }
          if (Test-Path $lnk) { throw "Uninstalling left $lnk" }
          Write-Output "PASS: the MSI installs buwiz.exe, its Start menu shortcut and uninstall entry, and uninstalls"

      # release.yml's publish job uploads them to R2 once every platform
      # has built, so a failed build leaves the version empty.
      - uses: actions/upload-artifact@v4
        with:
          name: release-file-windows-x64-exe
          path: app/target/installer/Buwiz-${{ inputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: release-file-windows-x64-msi
          path: app/target/installer/Buwiz-${{ inputs.version }}-windows-x64.msi
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing material
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "windows-release-signing.pfx")
