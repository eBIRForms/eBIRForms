name: secrets

# The secret scan on every change, docs included: ci skips text-only
# changes, and Markdown can carry a BIR host or a TIN as well as code can.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-secrets.sh
