[package]
name = "bir-core"
description = "BIR forms, field validation, deadlines, penalties, local storage and IAF XML. No network."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = "allow"

[features]
# Test fixtures of other crates: raw SQL on the connection, to stage a filed
# return or force a failing write. Never on in a build that ships.
test-support = []

[dependencies]
bir-rules.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
urlencoding = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.3"
dotenvy = { workspace = true }
rand = "0.10.1"
hex = "0.4.3"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
uuid = { version = "1.23.1", features = ["v4"] }

# SQLCipher, bundled with the platform's crypto (CommonCrypto on macOS and
# iOS, OpenSSL on Windows and Linux) everywhere but Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
# Native keychain access for the SQLCipher master key (see src/keychain.rs).
security-framework = "3"

# windows-native is required: keyring 3.x has no default credential store, so
# a featureless build silently falls back to an in-memory mock. The SQLCipher
# master key then never persists and every relaunch regenerates it, which
# makes the existing database unreadable and gets it quarantined.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
# Windows has no system OpenSSL for SQLCipher to link: build one in (needs
# Perl, which the MSVC toolchain installs alongside Git for Windows).
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

# sync-secret-service is required for the same reason as windows-native above:
# without a backend feature keyring 3.x uses its in-memory mock and the master
# key is lost on every relaunch. crypto-rust avoids an OpenSSL dependency; the
# libdbus it links against ships with every desktop distro. On a headless box
# with no Secret Service, get_password returns PlatformFailure and
# db::get_or_create_master_key_keyring falls back to bir_key.txt.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

# iOS: the keychain through `keyring` (Security.framework); SQLCipher uses
# CommonCrypto there, so no OpenSSL is linked.
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# Android: no keyring backend exists, so the master key lives in
# `bir_key.txt` in the app's private data directory (`db::mod`); `keyring`
# is here for its error type only and is never called. SQLCipher uses its
# LibTomCrypt provider (crates/sqlcipher-tomcrypt), so no OpenSSL is linked:
# rusqlite's non-bundled `sqlcipher` links that crate's `libsqlcipher.a`, and
# `modern_sqlite` gives it the bundled bindings `bundled-sqlcipher` has.
# `crates/sqlcipher-tomcrypt/compat/check.sh` proves the files compatible.
[target.'cfg(target_os = "android")'.dependencies]
keyring = { workspace = true }
rusqlite = { workspace = true, features = ["sqlcipher", "modern_sqlite"] }
sqlcipher-tomcrypt = { path = "../sqlcipher-tomcrypt" }

[dev-dependencies]
insta = "1"
tempfile = "3"
temp-env = { version = "0.3", features = ["async_closure"] }
tokio = { workspace = true, features = ["test-util"] }
