[package]
name = "bir-print"
description = "Filled BIR form sheets as HTML, and a PdfSink seam for PDF output per OS."
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "verify_certification_pdf"
path = "src/bin/verify_certification_pdf.rs"

[dependencies]
bir-core.workspace = true
tempfile = "3.27.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
lopdf = "0.34"
schemars = "1.0"
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
flate2 = "1"
