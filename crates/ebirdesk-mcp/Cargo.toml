[package]
name = "ebirdesk-mcp"
description = "The desktop app without a window: the eBIRForms Desktop mini app (app.buwiz.ebirdesk), an MCP server on stdio that the Buwiz Bot spawns."
# The manifest's version: raise it on every release the Bot gets.
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ebirdesk-mcp"
path = "src/main.rs"

[dependencies]
bir-app-core.workspace = true
buwiz-plugin.workspace = true
serde_json.workspace = true
regex.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
