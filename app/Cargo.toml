[package]
name = "buwiz"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace, as in rox: `cargo ra-jit` builds and patches this
# crate from `app/`. `android` is the Android library (`libnsh.so`), built
# only by `android.sh`; a plain `cargo build` here builds the app.
[workspace]
members = [".", "android"]
default-members = ["."]

[dependencies]
bir-app-core = { path = "../crates/bir-app-core" }
nsh-core = { path = "../nsh/crates/nsh-core" }
nsh-base = { path = "../nsh/crates/nsh-base" }
nsh-engine = { path = "../nsh/crates/nsh-engine" }
ra-jit-live = { path = "../blaze/crates/ra-jit-live" }
env_logger = "0.11"
# Today and yesterday for the date chips (already in the lock through bir-core).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { path = "../nsh/crates/nsh-platform-macos", default-features = false }
# The print preview's PDF (WKWebView createPDF) and the save / open / print
# panels: AppKit, WebKit and PDFKit through objc2, as nsh reaches them.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSArray", "NSGeometry"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
thiserror = "2"

# iOS (the simulator): nsh's UIKit backend and its release runner, with no
# JS runtime. `ios.sh` builds the `buwiz` binary for
# aarch64-apple-ios-sim and packs it as an app.
[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { path = "../nsh/crates/nsh-platform-ios", default-features = false }
nsh-ios-app = { path = "../nsh/crates/nsh-ios-app", default-features = false }
# Printing: UIKit's print dialog, PDF context and share sheet, WebKit's
# print formatter, through objc2.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSArray", "NSGeometry"] }
dispatch2 = "0.3.1"
thiserror = "2"

[features]
# Scripted UI checks: nsh's gpui-agent control plane (local, token-guarded,
# and only when `GPUI_AGENT=1` is set at launch). Off in normal builds.
agent = ["nsh-platform-macos/gpui-agent"]

[lib]
name = "buwiz"
path = "src/lib.rs"

# Dependencies at full speed in dev builds; only `buwiz` stays a debug
# build, because ra-jit patches it. `debug-assertions = false` also turns
# off objc2's per-message signature checks, which cost rox most of its
# main thread.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
