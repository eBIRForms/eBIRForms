# The domain crates. The app (`app/`) is its own workspace, like rox's, so
# `cargo ra-jit` builds and patches it from its own directory; it takes
# these crates by path.
[workspace]
resolver = "2"
members = [
    "crates/bir-rules",
    "crates/bir-core",
    "crates/bir-print",
    "crates/bir-app-core",
    "crates/bir-submit",
    "crates/ebirdesk-mcp",
    "crates/sqlcipher-tomcrypt",
]
exclude = ["app", "nsh", "blaze", "crates/sqlcipher-tomcrypt/compat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
bir-rules = { path = "crates/bir-rules" }
bir-core = { path = "crates/bir-core" }
bir-print = { path = "crates/bir-print" }
bir-app-core = { path = "crates/bir-app-core" }
bir-submit = { path = "crates/bir-submit" }
# Mini App Protocol 2.0, the plugin half (ebirdesk-mcp), pinned by commit.
buwiz-plugin = { git = "https://github.com/buwiz-app/buwiz-sdk", rev = "c435794d080b3b246b70d3908922b996e6e5f9aa" }

# Third-party versions shared by the domain crates (carried over from the
# source repo's workspace at `oss-cut-base`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
# SQLCipher's build is chosen per target in bir-core's Cargo.toml: bundled
# (CommonCrypto on Apple, OpenSSL elsewhere), or on Android the LibTomCrypt
# build in crates/sqlcipher-tomcrypt. No features here, so none unify into
# the Android build.
rusqlite = { version = "0.32" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3" }
